name: Build Frame Control V2

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Frame Control V2 ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f FrameControl-V2.zip || { echo 'ERROR: Upload FrameControl-V2.zip to repository ROOT'; exit 1; }
          mkdir -p project
          unzip -q FrameControl-V2.zip -d project
          test -f project/settings.gradle.kts
          grep -E 'targetSdk|versionName' project/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -x "$SDK_MANAGER" || { echo 'sdkmanager not found'; exit 1; }
          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Report APK metadata
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging project/app/build/outputs/apk/debug/app-debug.apk | grep -E '^(package:|sdkVersion:|targetSdkVersion:)' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameControl-V2-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
