name: Build Frame Control APK (diagnostics)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check ZIP and extract it
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' zips < <(find . -maxdepth 1 -type f -iname '*.zip' -print0)
          printf 'ZIP archives found: %s\n' "${#zips[@]}"
          printf '%s\n' "${zips[@]}"
          if [ "${#zips[@]}" -ne 1 ]; then
            echo 'ERROR: Exactly ONE ZIP must be present in the repository root.'
            echo 'Delete old archives; otherwise the wrong version can be built.'
            exit 1
          fi
          mkdir -p project
          unzip -q "${zips[0]}" -d project
          test -f project/settings.gradle.kts || { echo 'ERROR: settings.gradle.kts is not in ZIP root'; exit 1; }
          echo '--- Gradle app config ---'
          grep -nE 'applicationId|targetSdk|minSdk|versionCode|versionName' project/app/build.gradle.kts || true
          echo '--- Source file ---'
          grep -Rn 'gamecube_frame_interpolation_for_sr' project/app/src/main || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -x "$SDK_MANAGER" || { echo 'sdkmanager not found'; exit 1; }
          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Report actual APK target SDK
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label:)"
          echo 'These values come from the COMPILED APK, not from the Gradle file.'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrameControl-diagnostic-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
